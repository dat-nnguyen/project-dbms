version: '3.8'
services:
  mysql-master:
    image: mysql:8.0
    container_name: mysql-master
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - ./master_conf:/etc/mysql/conf.d
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - repl-network
  mysql-slave1:
    image: mysql:8.0
    container_name: mysql-slave1
    environment:
      - MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - ./slave1_conf:/etc/mysql/conf.d
    networks:
      - repl-network
    depends_on:
      - mysql-master
  mysql-slave2:
    image: mysql:8.0
    container_name: mysql-slave2
    environment:
      - MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3308:3306"
    volumes:
      - ./slave2_conf:/etc/mysql/conf.d
    networks:
      - repl-network
    depends_on:
      - mysql-master
      
networks:
  repl-network:
    driver: bridge